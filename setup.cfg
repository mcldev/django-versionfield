[metadata]
name = django-versionfield
version = 1.1.0
description = A DB Independent Custom Django Field for storing Version numbers for fast indexing
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/mcldev/django-versionfield
author = Many Many Others, Michael Carder Ltd
author_email = codetoolbox@michaelcarder.co.uk
license = MIT License
install_requires = ['django>=4.2,<5.0']
python_requires = >=3.9
classifiers =
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 4.2
    Intended Audience :: Developers
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Internet :: WWW/HTTP
    Topic :: Internet :: WWW/HTTP :: Dynamic Content

[options]
include_package_data = true
packages = find:
